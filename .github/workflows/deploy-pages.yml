name: Deploy to GitHub Pages

on:
  push:
    branches: [dev_hy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cad-viewer/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cad-viewer
        run: pnpm install --frozen-lockfile

      # Local cad-data mirror (fonts + sample drawings). Not tracked by git —
      # upstream ships third-party fonts with no license grant — so the
      # deployment must sync its own copy; without it the built app would fall
      # back to the jsDelivr CDN.
      - name: Sync local cad-data assets
        working-directory: cad-viewer
        run: pnpm sync:cad-data

      - name: Build
        working-directory: cad-viewer
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cad-viewer/packages/cad-viewer-example/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
