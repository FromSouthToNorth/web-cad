<!DOCTYPE html>
<html lang="en" data-ml-ui-theme="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <title>DWG/DXF Viewer</title>
    <script>
      // Apply the persisted UI theme before first paint to avoid a flash.
      ;(function () {
        var theme = 'dark'
        try {
          var stored = window.localStorage.getItem('cad-viewer-example:ui-theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) { /* storage unavailable */ }
        document.documentElement.setAttribute('data-ml-ui-theme', theme)
        document.documentElement.classList.toggle('dark', theme === 'dark')

        // Style the loader before viewer CSS variables are available.
        var loader = document.getElementById('loader')
        var spinner = document.querySelector('.spinner')
        if (theme === 'dark') {
          if (loader) loader.style.background = '#0a0a0b'
          if (spinner) spinner.style.borderColor = '#27272a'
        }
      })()
    </script>
    <style>
      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ml-theme-bg-base, #f8fafc);
        z-index: 9999;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--ml-theme-border, #e2e8f0);
        border-top-color: var(--ml-theme-primary, #3b82f6);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading overlay -->
    <div id="loader">
      <div class="spinner"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
